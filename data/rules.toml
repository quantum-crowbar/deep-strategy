# Game rules as data (decision D13). Integers only: the sim never uses floats (D15).
# Distances are Chebyshev (max of |dx|, |dy|). "speed" is ticks per tile moved.
version = 1

[game]
map_size = 32
max_ticks = 3000
start_gold = 150
start_workers = 3
mine_amount = 2000
gather_ticks = 8       # ticks a worker spends digging per trip
gather_load = 10       # gold carried per trip
aggro_range = 6        # idle military chase enemies this close
queue_max = 5

[units.worker]
cost = 50
hp = 30
speed = 4
damage = 0
range = 1
cooldown = 8
train_ticks = 40
from = "hall"

[units.sword]
cost = 80
hp = 60
speed = 4
damage = 8
range = 1
cooldown = 8
train_ticks = 50
from = "barracks"

[units.archer]
cost = 90
hp = 40
speed = 4
damage = 7
range = 4
cooldown = 10
train_ticks = 50
from = "barracks"

[units.knight]
cost = 120
hp = 90
speed = 2
damage = 10
range = 1
cooldown = 8
train_ticks = 60
from = "barracks"

[buildings.hall]
hp = 400
cost = 0
build_ticks = 0

[buildings.barracks]
hp = 200
cost = 150
build_ticks = 60

# Counter table: percent damage when ATTACKER hits DEFENDER; missing pairs are 100.
# sword beats knight, knight beats archer, archer beats sword (rock-paper-scissors).
[counters]
"sword>knight" = 150
"knight>archer" = 150
"archer>sword" = 150
"knight>sword" = 70
"archer>knight" = 70
"sword>archer" = 70
