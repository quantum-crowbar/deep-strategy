<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deep-strategy viewer</title>
<style>
  :root { --bg:#14171c; --panel:#1d222b; --fg:#e6e9ef; --dim:#8b93a3; --p0:#e0b43a; --p1:#7e8aa8; --accent:#4aa3ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef0f4; --panel:#fff; --fg:#1b1f27; --dim:#5c6473; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:12px 16px; display:grid; grid-template-columns:minmax(0,780px) minmax(220px,1fr); gap:16px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  canvas { width:100%; max-width:768px; aspect-ratio:1; background:#2a3a2a; border-radius:6px; image-rendering:pixelated; display:block; }
  .panel { background:var(--panel); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  button, select { background:var(--panel); color:var(--fg); border:1px solid var(--dim); border-radius:4px; padding:4px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  input[type=range] { flex:1; min-width:120px; }
  h1 { font-size:16px; margin:0 0 6px; } h2 { font-size:13px; margin:0 0 4px; color:var(--dim); font-weight:600; }
  .p0 { color:var(--p0); } .p1 { color:var(--p1); } .dim { color:var(--dim); }
  #log { font:12px ui-monospace, monospace; max-height:180px; overflow:auto; white-space:pre-wrap; }
  #status { color:var(--dim); }
</style>
</head>
<body>
<main>
  <div>
    <canvas id="c" width="768" height="768"></canvas>
    <div class="panel">
      <div class="row">
        <button id="play">Pause</button><button id="step">Step</button>
        <label>speed <select id="speed"><option>5</option><option>10</option><option selected>20</option><option>60</option><option>200</option><option>1000</option></select> ticks/s</label>
        <span id="tick" class="dim"></span>
      </div>
      <div class="row"><input id="scrub" type="range" min="0" max="0" value="0" disabled><span id="status"></span></div>
    </div>
  </div>
  <div>
    <div class="panel"><h1 id="title">deep-strategy</h1><div id="players"></div></div>
    <div class="panel"><h2>Source</h2>
      <div class="row"><button id="live">Watch live</button>
      <select id="replays"><option value="">replays&hellip;</option></select><button id="load">Open</button></div>
      <div class="row"><label>skin <select id="skin"><option value="tinyswords">tinyswords</option><option value="placeholder">placeholder</option></select></label></div>
    </div>
    <div class="panel"><h2>Selected</h2><div id="sel" class="dim">click a unit</div></div>
    <div class="panel"><h2>Agent notes</h2><div id="log" class="dim"></div></div>
  </div>
</main>
<script src="viewer.js"></script>
</body>
</html>
